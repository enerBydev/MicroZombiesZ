name: CI

# DevOps (Plan→Monitor): integración continua de MicroZombiesZ.
# Se ejecuta en cada push/PR hacia main y develop (y manualmente).
# Matrix reducida a Node 22: el toolchain ESLint actual exige Object.groupBy
# (no disponible en Node 20), y Nix/flake ya fija Node 22 como runtime.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  qa:
    name: QA (lint · tipos · tests · build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx nuxt prepare
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx nuxt typecheck
      - name: Unit tests + cobertura
        run: npx vitest run --coverage
      - name: Build
        run: npm run build
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
