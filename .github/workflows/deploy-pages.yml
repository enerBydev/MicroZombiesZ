name: Deploy Pages

# Despliegue del juego (SPA estática) a GitHub Pages.
# El leaderboard comunitario requiere backend Nitro; en Pages la store degrada
# automáticamente a LocalLeaderboardRepository (Repository/Strategy fallback).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build estático (SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Genera sitio estático con base /MicroZombiesZ/
        run: npx nuxt generate
        env:
          NUXT_APP_BASE_URL: /MicroZombiesZ/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
